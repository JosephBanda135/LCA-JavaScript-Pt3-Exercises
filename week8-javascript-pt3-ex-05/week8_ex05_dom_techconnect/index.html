<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />

    <title>TechConnect Developer Hub</title>
  </head>

  <body>
    <header class="text-center bg-dark text-white p-3">
      <h1>TechConnect Developer Community Hub</h1>
    </header>

    <main class="container my-4">
      <!-- CONTROLS SECTION -->
      <section id="controls" class="mb-4 text-center">
        <p id="developerCount">0 Developers</p>

        <input
          type="text"
          id="searchInput"
          class="form-control mb-2"
          placeholder="Search developers..."
        />

        <!-- Toggle Button  -->
        <button id="toggleViewBtn" class="btn btn-primary">Toggle View</button>
      </section>

      <section id="developerContainer" class="row g-3"></section>

      <section id="addDeveloperForm" class="mt-5">
        <h3>Add Developer</h3>

        <input id="nameInput" class="form-control mb-2" placeholder="Name" />

        <input id="roleInput" class="form-control mb-2" placeholder="Role" />

        <input
          id="locationInput"
          class="form-control mb-2"
          placeholder="Location"
        />

        <input
          id="avatarInput"
          class="form-control mb-2"
          placeholder="Avatar URL"
        />

        <input
          id="skillsInput"
          class="form-control mb-2"
          placeholder="Skills "
        />

        <button id="addDeveloperBtn" class="btn btn-success">
          Add Developer
        </button>
      </section>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
